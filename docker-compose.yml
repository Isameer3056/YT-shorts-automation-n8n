services:
  n8n:
    build: .
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST}/
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=${TZ:-UTC}
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/data
    expose:
      - "5678"

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n

  piper:
    image: rhasspy/wyoming-piper
    restart: unless-stopped
    command: --voice ${PIPER_VOICE:-en_US-lessac-medium}
    volumes:
      - piper_data:/data
    expose:
      - "10200"

  piper-bridge:
    build: ./piper-bridge
    restart: unless-stopped
    volumes:
      - ./data:/data
    depends_on:
      - piper
    expose:
      - "5001"

  ffmpeg-bridge:
    build: ./ffmpeg-bridge
    restart: unless-stopped
    volumes:
      - ./data:/data
    expose:
      - "5002"

volumes:
  n8n_data:
  caddy_data:
  caddy_config:
  piper_data:
